#Compose utilizado para testes locais, não é utilizado em produção.

version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    container_name: hub_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  neo4j:
    image: neo4j:5
    container_name: hub_neo4j
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687" 
    volumes:
      - neo4j_data:/data

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: dbeaver
    ports:
      - "127.0.0.1:8978:8978"
    environment:
      - CB_SERVER_NAME=CloudBeaver Community
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    networks:
      - hub_network
    restart: always

networks:
  hub_network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  cloudbeaver_data: