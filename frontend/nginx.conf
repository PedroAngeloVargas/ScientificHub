server {
    listen 8080;
    root /usr/share/nginx/html;

    # Redirecionamentos relativos (sem expor a porta 8080 atrás do Load Balancer)
    absolute_redirect off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Usada pelo Kubernetes e pelo Load Balancer
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location = / {
        return 302 /login;
    }

    # Ficheiros com hash no nome: podem ficar em cache para sempre.
    # (Usa "expires" e não "add_header": um add_header aqui anularia os cabeçalhos de segurança acima.)
    location /_next/static/ {
        expires max;
        try_files $uri =404;
    }

    # /login -> login.html (páginas geradas pelo next export)
    location / {
        expires -1;
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;
}
