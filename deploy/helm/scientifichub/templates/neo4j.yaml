# Neo4j (grafo de interesses do match-service), com disco persistente
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  labels:
    {{- include "scientifichub.labels" . | nindent 4 }}
    app.kubernetes.io/name: neo4j
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: scientifichub
        app.kubernetes.io/name: neo4j
      annotations:
        scientifichub/segredos: {{ .Values.segredos.checksum | quote }}
    spec:
      # Não injeta variáveis dos Services (ex: NEO4J_PORT_7687_TCP_PORT): o Neo4j recusa variáveis NEO4J_* desconhecidas
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
      containers:
        - name: neo4j
          image: {{ .Values.neo4j.imagem }}
          ports:
            - name: bolt
              containerPort: 7687
            - name: http
              containerPort: 7474
          env:
            # Sem o prefixo NEO4J_: o Neo4j lê qualquer NEO4J_* como configuração e recusa esta variável
            - name: SENHA_NEO4J
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.segredos.nome }}
                  key: NEO4J_PASSWORD
            - name: NEO4J_AUTH
              value: neo4j/$(SENHA_NEO4J)
            - name: NEO4J_server_memory_heap_initial__size
              value: {{ .Values.neo4j.memoria.heap | quote }}
            - name: NEO4J_server_memory_heap_max__size
              value: {{ .Values.neo4j.memoria.heap | quote }}
            - name: NEO4J_server_memory_pagecache_size
              value: {{ .Values.neo4j.memoria.pagecache | quote }}
          readinessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.neo4j.recursos | nindent 12 }}
          securityContext:
            {{- include "scientifichub.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: dados
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.neo4j.storageClass }}
        resources:
          requests:
            storage: {{ .Values.neo4j.disco }}
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  labels:
    {{- include "scientifichub.labels" . | nindent 4 }}
    app.kubernetes.io/name: neo4j
spec:
  selector:
    app.kubernetes.io/name: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
